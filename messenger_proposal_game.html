<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Lao & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            font-family: 'Noto Sans Lao', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom scrollbar for chat body */
        .chat-body::-webkit-scrollbar {
            width: 5px;
        }
        .chat-body::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typingAnimation 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnimation {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Message Bubble Animation */
        .message-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(12px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Floating background hearts */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            pointer-events: none;
            animation: floatUp 7s linear infinite;
            opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Messenger Gradient Bubble */
        .bg-messenger-gradient {
            background: linear-gradient(135deg, #0084FF 0%, #A033FF 50%, #FF5280 100%);
        }

        .bg-messenger-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Smooth button movement */
        #btn-no {
            transition: transform 0.2s ease-out, top 0.2s ease-out, left 0.2s ease-out;
        }
    </style>
</head>

    <!-- Audio Effects & Game Flow Script -->
    <script>
        // Web Audio Synthesizer for UI sound effects
        let audioCtx;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playPopSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio play blocked", e);
            }
        }

        function playFanfareSound() {
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.1);

                    gain.gain.setValueAtTime(0.2, ctx.currentTime + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.1 + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + index * 0.1);
                    osc.stop(ctx.currentTime + index * 0.1 + 0.3);
                });
            } catch (e) {
                console.log("Audio play blocked", e);
            }
        }

        // Floating Hearts Background
        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartIcons = ['💖', '💕', '💗', '🌸', '✨', '❤️'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-lg sm:text-2xl';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${5 + Math.random() * 5}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(heart);
            }
        }

        // State Tracking for 5 Steps & Answers
        let currentStep = 1;
        const userAnswers = [];

        // DOM Elements
        const chatBody = document.getElementById('chat-body');
        const typingIndicator = document.getElementById('typing-indicator');
        const buttonGroup = document.getElementById('button-group');
        const actionArea = document.getElementById('action-area');
        const successModal = document.getElementById('success-modal');
        const modalCard = document.getElementById('modal-card');
        const answersSummary = document.getElementById('answers-summary');

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.remove('hidden');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.add('hidden');
        }

        function addReceivedMessage(text) {
            playPopSound();
            const msgContainer = document.createElement('div');

        function addSentMessage(text) {
            playPopSound();
            const msgContainer = document.createElement('div');
            msgContainer.className = 'flex items-end justify-end space-x-2 message-pop';
            msgContainer.innerHTML = `
                <div class="bg-messenger-gradient text-white rounded-2xl rounded-br-sm px-4 py-2.5 max-w-[78%] text-sm font-medium shadow-md">
                    ${text}
                </div>
            `;
            chatBody.appendChild(msgContainer);
            scrollToBottom();
        }

        // Render Action Buttons based on current step
        function renderButtons() {
            buttonGroup.innerHTML = '';
            
            if (currentStep === 1) {
                buttonGroup.innerHTML = `
                    <button id="btn-yes-1" class="flex-1 bg-messenger-gradient text-white font-bold py-2.5 px-5 rounded-full shadow hover:scale-105 active:scale-95 transition z-10">
                        ເປັນ ❤️
                    </button>
                    <button id="btn-no-1" class="flex-1 bg-gray-100 text-gray-600 font-semibold py-2.5 px-5 rounded-full shadow hover:bg-gray-200 transition relative z-20">
                        ບໍ່ເປັນ
                    </button>
                `;
                
                const btnYes = document.getElementById('btn-yes-1');
                const btnNo = document.getElementById('btn-no-1');
                
                btnYes.onclick = () => selectOption("ເປັນ", 1);
                
                let dodgeCount = 0;
                const dodgeFn = (e) => {
                    if (e) e.preventDefault();
                    playPopSound();
                    dodgeCount++;
                    const offsetX = (Math.random() - 0.5) * 150;
                    const offsetY = (Math.random() - 0.5) * 50;
                    btnNo.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(0.9)`;
                    
                    if (dodgeCount >= 4) {
                        btnNo.innerText = "ເປັນ! 💕";
                        btnNo.className = "flex-1 bg-pink-500 text-white font-bold py-2.5 px-5 rounded-full shadow transition";
                        btnNo.style.transform = "none";
                        btnNo.onmouseenter = null;
                        btnNo.ontouchstart = null;
                        btnNo.onclick = () => selectOption("ເປັນ", 1);
                    }
                };

                btnNo.addEventListener('mouseenter', dodgeFn);
                btnNo.addEventListener('touchstart', dodgeFn);
                btnNo.addEventListener('click', dodgeFn);

            } else if (currentStep === 2) {
                buttonGroup.innerHTML = `
                    <button onclick="selectOption('ແມ່ນຂ້ອຍຈະເປັນ', 1)" class="w-full sm:w-auto flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 px-4 rounded-full shadow text-xs sm:text-sm">
                        ແມ່ນຂ້ອຍຈະເປັນ 💖
                    </button>
                    <button onclick="selectOption('ອື່ມຂໍຄີດເບີ່ງກ່ອນນ', 2)" class="w-full sm:w-auto flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 px-4 rounded-full shadow text-xs sm:text-sm">
                        ອື່ມຂໍຄີດເບີ່ງກ່ອນນ 🤔
                    </button>
                `;
            } else if (currentStep === 3) {
                buttonGroup.innerHTML = `
                    <button onclick="selectOption('ເຫມາະ', 1)" class="flex-1 bg-messenger-gradient text-white font-bold py-2.5 px-6 rounded-full shadow">
                        ເຫມາະ ✨
                    </button>
                    <button onclick="selectOption('ບໍ່ເຫມາະ', 2)" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 px-6 rounded-full shadow">
                        ບໍ່ເຫມາະ 😅
                    </button>
                `;
            } else if (currentStep === 4) {
                buttonGroup.innerHTML = `
                    <button onclick="selectOption('ບໍ່ມັກພໍໃຈກັບສີ່ງທີເປັນ', 1)" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-3 rounded-full shadow text-xs">
                        ບໍ່ມັກພໍໃຈກັບສີ່ງທີເປັນ 💖
                    </button>
                    <button onclick="selectOption('ມັກຄົນທີມີຖານະທີດີກວ່ານີ້', 2)" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-3 rounded-full shadow text-xs">
                        ມັກຄົນທີມີຖານະທີດີກວ່ານີ້ 💎
                    </button>
                `;
            } else if (currentStep === 5) {
                buttonGroup.className = "grid grid-cols-2 gap-2 w-full max-w-sm";
                buttonGroup.innerHTML = `
                    <button onclick="selectOption('ຮັກ', 1)" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-3 rounded-xl shadow text-xs">
                        1. ຮັກ ❤️
                    </button>
                    <button onclick="selectOption('ບໍ່ຄີດ', 2)" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-3 rounded-xl shadow text-xs">
                        2. ບໍ່ຄີດ 😇
                    </button>
                    <button onclick="selectOption('ຮັກທີສຸດຄືກັນ', 3)" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-3 rounded-xl shadow text-xs">
                        3. ຮັກທີສຸດຄືກັນ 💕
                    </button>
                    <button onclick="selectOption('ຂໍຄີດກ່ອນ', 4)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-3 rounded-xl shadow text-xs">
                        4. ຂໍຄີດກ່ອນ 🤔
                    </button>
                `;
            }
        }

        // Disable input buttons during bot response
        function setButtonsDisabled(disabled) {
            actionArea.style.opacity = disabled ? '0.4' : '1';
            actionArea.style.pointerEvents = disabled ? 'none' : 'auto';
        }

        // User Selection Controller
        function selectOption(text, choiceIndex) {
            userAnswers.push({ step: currentStep, choiceText: text });
            addSentMessage(text);
            setButtonsDisabled(true);

            if (currentStep === 1) {
                setTimeout(() => {
                    showTyping();
                    setTimeout(() => {
                        hideTyping();
                        addReceivedMessage("ຂ້ອຍຈະຮັກທີສຸດເລີຍ 💖");
                        setTimeout(() => {
                            showTyping();
                            setTimeout(() => {
                                hideTyping();
                                addReceivedMessage("ແຢ້ເລີຍ! 🎉");
                                startStep2();
                            }, 1000);
                        }, 700);
                    }, 1200);
                }, 500);

            } else if (currentStep === 2) {
                setTimeout(() => {
                    showTyping();
                    setTimeout(() => {
                        hideTyping();
                        if (choiceIndex === 1) {
                            addReceivedMessage("ຂອບໃຈທີເລືອກຂ້ອຍຂ້ອຍຈະຮັກເຈົ້າທີສຸດ 🥰");
                            startStep3();
                        } else {
                            addReceivedMessage("ບໍ່ເປັນຫຍັງ 🥺");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ຂ້ອຍຈະຖ້າຄຳຕອບ 💕");
                                    startStep3();
                                }, 1000);
                            }, 700);
                        }
                    }, 1200);
                }, 500);

            } else if (currentStep === 3) {
                setTimeout(() => {
                    showTyping();
                    setTimeout(() => {
                        hideTyping();
                        if (choiceIndex === 1) {
                            addReceivedMessage("ໂດຍບີ້ 🥰💖");
                            startStep4();
                        } else {
                            addReceivedMessage("ໂອເຄຣ 🥺");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ຂ້ອຍເຂົ້າໃຈ 💭");
                                    startStep4();
                                }, 1000);
                            }, 700);
                        }
                    }, 1200);
                }, 500);

            } else if (currentStep === 4) {
                setTimeout(() => {
                    showTyping();
                    setTimeout(() => {
                        hideTyping();
                        if (choiceIndex === 1) {
                            addReceivedMessage("ຂອບໃຈທີເຂົ້າໃຈກັນ ✨");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ເພາະຂ້ອຍຮັກຄົນທີໃຈ ແລະ ໃຫ້ເທົ່າທີມີ ❤️");
                                    startStep5();
                                }, 1000);
                            }, 700);
                        } else {
                            addReceivedMessage("ເຮົາຄົງຈະໄປກັນຍາກເພາະຂ້ອຍບໍ່ໄດ້ຮັງປານນັ້ນ 🥺");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ເຮົາສາມາດເຂົ້າໃຈກັນໄດ້ 💬");
                                    startStep5();
                                }, 1000);
                            }, 700);
                        }
                    }, 1200);
                }, 500);

            } else if (currentStep === 5) {
                setTimeout(() => {
                    showTyping();
                    setTimeout(() => {
                        hideTyping();
                        if (choiceIndex === 1) {
                            addReceivedMessage("ຂອບໃຈຮັກສຸດໆເລີຍ ❤️🥰");
                            finishGame();
                        } else if (choiceIndex === 2) {
                            addReceivedMessage("ແມ່ນຫວາ 😄");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ຂອບໃຈເພີ່ນ 💕");
                                    finishGame();
                                }, 1000);
                            }, 700);
                        } else if (choiceIndex === 3) {
                            addReceivedMessage("ຮັກເພີ່ນທີສຸດເຊັ່ນກັນ 💖✨");
                            finishGame();
                        } else if (choiceIndex === 4) {
                            addReceivedMessage("ໂດຍ 💬");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ຂອບໃຈທີອ່ານ 🥰");
                                    finishGame();
                                }, 1000);
                            }, 700);
                        }
                    }, 1200);
                }, 500);
            }
        }

        // STEP SEQUENCERS
        function startStep2() {
            currentStep = 2;
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addReceivedMessage("ເຈົ້າຈະເປັນແທ້ບໍ້?");
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            hideTyping();
                            addReceivedMessage("ຂ້ອຍເປັນຄົນຮັກໃຜຮັກແທ້ໃດ 💖");
                            renderButtons();
                            setButtonsDisabled(false);
                        }, 1000);
                    }, 700);
                }, 1200);
            }, 800);
        }

        function startStep3() {
            currentStep = 3;
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addReceivedMessage("ເຈົ້າວ່າຂ້ອຍເຫມາະສົມທີຈະຮັກເຈົ້າບໍ່?");
                    renderButtons();
                    setButtonsDisabled(false);
                }, 1200);
            }, 800);
        }

        function startStep4() {
            currentStep = 4;
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addReceivedMessage("ເຈົ້າຮັກແລະມັກຂ້ອຍທີຖານະຫຼືບໍ່?");
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            hideTyping();
                            addReceivedMessage("ເພາະຂ້ອຍເປັນຄົນທີບໍ່ມັກຄົນຄົບກັນທີຖານະ 💭");
                            renderButtons();
                            setButtonsDisabled(false);
                        }, 1000);
                    }, 700);
                }, 1200);
            }, 800);
        }

        function startStep5() {
            currentStep = 5;
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addReceivedMessage("ເຈົ້າຈະຮັກຂ້ອຍຕະຫຼອດໄປຫຼືບໍ່?");
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            hideTyping();
                            addReceivedMessage("ຫຼື ເຈົ້າຄີດນອກໃຈບໍ່?");
                            setTimeout(() => {
                                showTyping();
                                setTimeout(() => {
                                    hideTyping();
                                    addReceivedMessage("ຂ້ອຍຮັກເຈົ້າທີສຸດເລີຍ 💖🥰");
                                    renderButtons();
                                    setButtonsDisabled(false);
                                }, 1000);
                            }, 700);
                        }, 1000);
                    }, 700);
                }, 1200);
            }, 800);
        }

        // Completion & Final Modal Logic
        function finishGame() {
            triggerConfetti();
            playFanfareSound();
            
            // Build summary HTML
            answersSummary.innerHTML = '';
            userAnswers.forEach((ans, i) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center text-gray-700';
                item.innerHTML = `
                    <span class="font-medium text-gray-500">ຂໍ້ທີ ${i + 1}:</span>
                    <span class="font-bold text-pink-600 bg-pink-100/80 px-2 py-0.5 rounded-full">${ans.choiceText}</span>
                `;
                answersSummary.appendChild(item);
            });

            setTimeout(() => {
                showModal();
            }, 1200);
        }

        // Format and Send WhatsApp Message
        function sendToWhatsApp() {

            const myPhoneNumber = "8562051984140";

            let message = `💖 *ຄຳຕອບເກມຂໍເປັນແຟນ Messenger* 💖\n\n`;
            userAnswers.forEach((ans, i) => {
                message += `ຂໍ້ທີ ${i + 1}: ${ans.choiceText}\n`;
            });
            message += `\n✨ ສົ່ງດ້ວຍຄວາມຮັກ 🥰`;

            const encodedMsg = encodeURIComponent(message);
            // Opens WhatsApp link directly
            window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
        }

        function triggerConfetti() {
            var count = 250;
            var defaults = { origin: { y: 0.7 } };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }
            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff69b4', '#ff1493', '#0084ff'] });
            fire(0.2, { spread: 60, colors: ['#ffffff', '#ff6584'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#e74c3c', '#f1c40f', '#8e44ad'] });
        }

        function showModal() {
            successModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-75');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            successModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-75');
        }

        // Initial Load
        window.onload = function() {
            createFloatingHearts();
            renderButtons();

            // Step 1 Initial Questions Sequence
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addReceivedMessage("ທທ");
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            hideTyping();
                            addReceivedMessage("ເປັນແຟນກັນບໍ?");
                            setButtonsDisabled(false);
                        }, 1200);
                    }, 800);
                }, 1000);
            }, 600);
        };
    </script>
